function statsBP(g,o,side){const f=(n,d=3)=>isFinite(n)?n.toFixed(d):'-';
 return (side?[side]:['a','h']).map(s=>{const t=T(g[s]),A=agg(g[s],null,g);

    const cb=A.bat[st.pid]||b,cobp=(cb.H+cb.BB+cb.HBP)/(cb.AB+cb.BB+cb.HBP+cb.SF),cslg=(cb.H+cb.d2+2*cb.d3+3*cb.HR)/cb.AB;
    const posLines=[st.tag=='DEF'?`(${st.positions[0]})`:(st.tag?`(${st.tag})`:st.positions[0]),...st.positions.slice(1).map(p=>`(${p})`)].filter(Boolean).join('<br>');
    rows.push(`<tr><td style="${stk(0,22)}">${si==0?slot+1:''}</td><td style="${stk(22,60)}">${nm(st.pid)}</td><td class=pcell style="${stk(82,40)}">${posLines}</td><td>${b.PA}</td><td>${b.AB}</td><td>${b.H}</td><td>${b.H-b.d2-b.d3-b.HR}</td><td>${b.d2}</td><td>${b.d3}</td><td>${b.HR}</td><td>${b.RBI}</td><td>${b.SB}</td><td>${b.BB+b.HBP}</td><td>${b.K}</td><td>${b.SH}</td><td>${b.SF}</td><td>${f(cb.H/cb.AB)}</td><td>${f(cobp+cslg)}</td></tr>`)
   })
  }
  const pt=o.pitOrder[s].map(pid=>{const q=o.pt[pid],c=A.pt[pid]||q;
   return `<tr><td style="${stk(0,70)}">${nm(pid)}</td><td>${Math.floor(q.outs/3)}.${q.outs%3}</td><td>${q.BF}</td><td>${q.P}</td><td>${q.S}</td><td>${q.B}</td><td>${q.K}</td><td>${q.H}</td><td>${q.HR||0}</td><td>${q.BB}</td><td>${q.HBP}</td><td>${q.R}</td><td>${q.ER}</td><td>${q.R-q.ER}</td><td>${(g.fin||o.over)?(q.W?'勝':q.L?'敗':'無關'):'-'}</td><td>${f(c.ER*27/c.outs,2)}</td><td>${f((c.BB+c.H)*3/c.outs,2)}</td></tr>`}).join('');
  return `<div class=c><h3>${t.name} 打擊</h3><div class=sc><table><tr><th style="${stk(0,22)}"></th><th style="${stk(22,60)}">球員</th><th style="${stk(82,40)}">守位</th><th>打席</th><th>打數</th><th>安打</th><th>一安</th><th>二安</th><th>三安</th><th>全壘打</th><th>打點</th><th>盜壘</th><th>四死</th><th>被三振</th><th>犠短</th><th>犠飛</th><th>打擊率</th><th>OPS</th></tr>${rows.join('')}</table></div>
  <h3>${t.name} 投手</h3><div class=sc><table><tr><th style="${stk(0,70)}"></th><th>局數</th><th>面對打席</th><th>用球</th><th>好球</th><th>壞球</th><th>奪三振</th><th>被安打</th><th>被全壘打</th><th>四壞</th><th>觸身</th><th>失分</th><th>自責</th><th>非自責</th><th>勝敗</th><th>ERA</th><th>WHIP</th></tr>${pt}</table></div></div>`}).join('')}
const LP={t:null,f:false,x:0,y:0};
